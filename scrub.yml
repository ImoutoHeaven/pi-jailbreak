# scrub.yml: the outbound text rewrite.
#
# A gateway that pattern-matches a prompt answers with a fabricated quota error instead of a model
# reply. Every rule here rewrites one matched string into the same words with an invisible marker
# inside, so the gateway reads different bytes while the model reads the same sentence.
#
# `scope: system+user` rewrites every string that travels out: the system prompt (the head text, each
# section beside it, and the persona text at its head) and user messages, which is where a fabricated
# turn lands. Assistant messages, tool results and thinking blocks are never touched.
#
# Four actions exist and each one only inserts a marker: `zw` puts U+200B after every word gap and
# keeps the gap, `first` puts U+200B after the first rune of the match, `soft` puts U+00AD inside each
# word long enough to hold one, `cgj` puts U+034F after the first rune of each word. Nothing here
# rewrites or deletes a character, so stripping the markers gives the source back and a second pass
# lands on the bytes of the first, for any rule set and any input.

scope: system+user

rules:
  # The stock identity sentence at the head of every system prompt.
  - match: "You are a coding assistant running inside pi, a coding agent harness."
    action: zw
  - match: "You are an expert coding assistant operating inside pi, a coding agent harness."
    action: zw

  # Other agents whose identity sentence is enough to trip a gate.
  - match: "You are Codex, a coding agent based on GPT-5."
    action: zw
  - match: "You are Codex, an agent based on GPT-5."
    action: zw
  - match: "You are opencode"
    action: zw
  - match: "You are GPT-5"
    action: zw

  # The gate's own category names. A code the model echoes back with a marker in it is read as the
  # same code, so a scrubbed enum costs nothing at the tool boundary. The longer spellings come first
  # so the alternation prefers them; `CSAM` is separate because it is also a word on its own.
